[package]
name = "oxide-agent-web-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
too_many_lines = "warn"

[dependencies]
ammonia = "4.1.2"
chrono = { version = "0.4", default-features = false, features = ["serde"] }
comrak = { version = "0.52.0", default-features = false }
console_error_panic_hook = "0.1.7"
futures-util = "0.3.32"
gloo-net = "0.7.0"
js-sys = "0.3.99"
leptos = { version = "0.8.19", features = ["csr"] }
leptos_router = "0.8.13"
oxide-agent-web-contracts = { version = "0.1.0", path = "../oxide-agent-web-contracts" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
wasm-bindgen-futures = "0.4.72"
wasm-bindgen = "0.2.122"
web-sys = { version = "0.3.99", features = ["AnalyserNode", "AudioContext", "AudioNode", "BaseAudioContext", "Blob", "BlobEvent", "BlobPropertyBag", "Clipboard", "ClipboardEvent", "DataTransfer", "DragEvent", "Element", "Event", "File", "FileList", "FilePropertyBag", "FormData", "HtmlElement", "HtmlInputElement", "MediaDevices", "MediaRecorder", "MediaRecorderOptions", "MediaStream", "MediaStreamAudioSourceNode", "MediaStreamConstraints", "MediaStreamTrack", "MouseEvent", "Navigator", "Node", "Performance", "RequestCredentials", "UiEvent", "Window"] }
gloo-timers = { version = "0.3.0", features = ["futures"] }
