name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check-profiles:
    name: Check profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
      - uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-check-target-${{ hashFiles('Cargo.lock') }}
      - run: |
          set -euo pipefail
          for features in profile-full profile-embedded-opencode-local profile-web-embedded-opencode-local; do
            cargo check --workspace --no-default-features --features "${features}"
          done

  clippy-test:
    name: Clippy + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: oxide_agent
          POSTGRES_PASSWORD: oxide_agent
          POSTGRES_DB: oxide_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TELEGRAM_TOKEN: dummy_token
      TELEGRAM_ALLOWED_USERS: "123456789"
      OPENROUTER_API_KEY: dummy
      OXIDE_DATABASE_TEST_URL: postgres://oxide_agent:oxide_agent@localhost:5432/oxide_agent_test
      OPENAI_BASE_PROVIDERS__1__NAME: zai
      OPENAI_BASE_PROVIDERS__1__API_BASE: https://api.z.ai/api/coding/paas/v4
      OPENAI_BASE_PROVIDERS__1__API_KEY: dummy
      OPENAI_BASE_PROVIDERS__1__PROFILE: zai
      LOOP_DETECTION_ENABLED: "true"
      LOOP_TOOL_CALL_THRESHOLD: "5"
      LOOP_CONTENT_CHUNK_SIZE: "50"
      LOOP_CONTENT_THRESHOLD: "10"
      LOOP_MAX_HISTORY_LENGTH: "5000"
      LOOP_LLM_CHECK_AFTER_TURNS: "25"
      LOOP_LLM_CHECK_INTERVAL: "3"
      LOOP_LLM_CONFIDENCE_THRESHOLD: "0.9"
      LOOP_LLM_HISTORY_COUNT: "20"
      LOOP_SCOUT_MODEL: labs-devstral-small-2512
      AGENT_MODEL_ID: glm-4.7
      AGENT_MODEL_PROVIDER: openai-base:zai
      AGENT_MODEL_MAX_OUTPUT_TOKENS: "48000"
      SUB_AGENT_MODEL_ID: glm-4.5-air
      SUB_AGENT_MODEL_PROVIDER: openai-base:zai
      SUB_AGENT_MAX_OUTPUT_TOKENS: "48000"
      MEDIA_MODEL_ID: google/gemini-3-flash-preview
      MEDIA_MODEL_PROVIDER: openrouter
      NARRATOR_MODEL_ID: google/gemini-3-flash-preview
      NARRATOR_MODEL_PROVIDER: openrouter
      RUN_LLM_PROVIDER_CHECKS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
      - uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --no-default-features --features profile-full
      - run: cargo test -p oxide-agent-core --no-default-features --features storage-sqlx sqlx_storage_connects_and_runs_migrations_when_test_url_is_set

  dockerfile-lint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: |
          set -euo pipefail
          docker build --check \
            -f docker/Dockerfile.app \
            --build-arg CARGO_FEATURES="oxide-agent-telegram-bot/profile-embedded-opencode-local" \
            --build-arg PACKAGES="oxide-agent-telegram-bot" \
            --build-arg BINARIES="oxide-agent-telegram-bot" \
            --build-arg MCP_BINARIES="" \
            .
          docker build --check \
            -f docker/Dockerfile.app \
            --build-arg CARGO_FEATURES="oxide-agent-telegram-bot/profile-full,oxide-agent-sandboxd/profile-full" \
            --build-arg PACKAGES="oxide-agent-telegram-bot oxide-agent-sandboxd" \
            --build-arg BINARIES="oxide-agent-telegram-bot oxide-agent-sandboxd" \
            --build-arg MCP_BINARIES="ssh-mcp jira-mcp mattermost-mcp" \
            .
